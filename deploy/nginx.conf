# RealAmadeus V2 — nginx reverse proxy for amadeus-server.
#
# Put these `location` blocks inside the `server { ... }` block of your site (or save this file
# as /etc/nginx/snippets/realamadeus.conf and `include snippets/realamadeus.conf;` there), then
# `sudo nginx -t && sudo systemctl reload nginx`. amadeus-server listens on 127.0.0.1:9502 with
# AMADEUS_BASE_PATH=/amadeus.
#
# `proxy_pass` has NO URI part on purpose: the request path (/amadeus/...) is forwarded
# unchanged, because amadeus-server itself serves everything under its base path — including
# `/amadeus` without a trailing slash (V1's canonical URL), so no redirect is needed.
# Other paths of the site (/, /amadeus_logo.png, /sw.js, ...) stay with your existing rules.
#
# Client IP: amadeus-server rate-limits FreeAPI by the FIRST X-Forwarded-For entry (else
# X-Real-IP), exactly like V1. `$proxy_add_x_forwarded_for` keeps the client address that a CDN
# or Cloudflare Tunnel in front of nginx put there. If nginx itself faces the internet, replace
# it with `$remote_addr` so clients cannot choose their own address. Behind cloudflared on the
# same host, prefer `set_real_ip_from 127.0.0.1; real_ip_header CF-Connecting-IP;` in the server
# block plus `$remote_addr`.
#
# Serving V2 side by side under another path (e.g. /amadeus-v2/): build with
# `cargo xtask dist web --base /amadeus-v2/`, run the second server with
# AMADEUS_BASE_PATH=/amadeus-v2 and AMADEUS_BIND=127.0.0.1:9503, and copy these blocks with
# /amadeus -> /amadeus-v2 and 9502 -> 9503.

# The app root without the trailing slash (exact match, so /amadeus_logo.png etc. are untouched).
location = /amadeus {
    proxy_pass http://127.0.0.1:9502;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Chat streaming (Server-Sent Events). Must not be buffered or compressed by nginx,
# otherwise tokens arrive in bursts or only at the end.
location ^~ /amadeus/app/api/chat/stream {
    proxy_pass http://127.0.0.1:9502;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    gzip off;
    # LLM responses can take minutes.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Tells an outer nginx (if this one sits behind another) not to buffer either.
    add_header X-Accel-Buffering no always;
}

# Everything else: the WASM app, static resources (Live2D models) and the JSON API.
# `^~` keeps regex locations of the site (e.g. `location ~* \.(js|css|png)$`) from taking over.
location ^~ /amadeus/ {
    proxy_pass http://127.0.0.1:9502;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Non-streaming chat and speech requests can be slow. STT uploads audio: amadeus-server
    # accepts up to 32 MiB there (16 MiB for JSON), so nginx must not reject less.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 32m;
}
