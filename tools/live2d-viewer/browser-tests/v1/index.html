<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; } #host { position: fixed; inset: 0; }</style>
</head><body><div id="host" class="live2d-host"></div>
<script>
// V1 host glue (Live2DCanvas.tsx): load both scripts, create the player, force the canvas styles.
function load(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
(async () => {
  await load('/resources/live2d/live2dcubismcore.min.js');
  for (let i = 0; i < 500; i++) { try { Live2DCubismCore.Version.csmGetVersion(); break; } catch (e) { await new Promise(r => setTimeout(r, 5)); } }
  await load('/resources/live2d/reama-cubism-runtime.js');
  const host = document.getElementById('host');
  const p = window.ReamaCubismRuntime.create(host);
  p.setEmotion((new URLSearchParams(location.search).get('emotion') || 'NORMAL').toUpperCase());
  p.setLipSync(0); p.setSpokenChar && p.setSpokenChar('');
  const c = host.querySelector('canvas'); if (c) { c.style.pointerEvents = 'auto'; c.style.width = '100%'; c.style.height = '100%'; }
  window.v1Player = p;
})();
</script></body></html>
